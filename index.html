<script>
let inputMode='paste',uploadedFiles=[],quizData=null,quizAnswers={},quizSubmitted=false,chatHistory=[],isSending=false,lastSummary=null,tutorBuilt=false;

function hasContent(){return inputMode==='paste'?document.getElementById('pasteArea').value.trim().length>=30:uploadedFiles.length>0}
function updateBtns(){const ok=hasContent();document.getElementById('summaryBtn').disabled=!ok;document.getElementById('quizBtn').disabled=!ok}
function onPasteInput(){const t=document.getElementById('pasteArea').value.trim();const w=t?t.split(/\s+/).length:0;document.getElementById('wc').textContent=w+' word'+(w!==1?'s':'');updateBtns();tutorBuilt=false}

// FIXED SWITCH LOGIC: Forces both tabs and content screens to sync flawlessly
function switchInput(m){
  inputMode = m;
  
  // 1. Clear and re-assign active classes on the top input tabs
  document.querySelectorAll('.itab').forEach(btn => {
    if (m === 'paste' && btn.textContent.includes('Paste')) btn.classList.add('active');
    else if (m === 'file' && btn.textContent.includes('Upload')) btn.classList.add('active');
    else btn.classList.remove('active');
  });

  // 2. Explicitly toggle display panels
  const pastePanel = document.getElementById('ipaste');
  const filePanel = document.getElementById('ifile');
  
  if (m === 'paste') {
    pastePanel.style.display = 'block';
    filePanel.style.display = 'none';
  } else {
    pastePanel.style.display = 'none';
    filePanel.style.display = 'block';
  }

  updateBtns();
  tutorBuilt = false;
}

function onDrag(e){e.preventDefault();document.getElementById('dropZone').classList.add('drag-over')}
function onDragLeave(){document.getElementById('dropZone').classList.remove('drag-over')}
function onDrop(e){e.preventDefault();document.getElementById('dropZone').classList.remove('drag-over');onFiles(e.dataTransfer.files)}
function onFiles(files){for(const f of files)if(!uploadedFiles.find(x=>x.name===f.name))uploadedFiles.push(f);renderFiles();updateBtns();tutorBuilt=false}
function removeFile(n){uploadedFiles=uploadedFiles.filter(f=>f.name!==n);renderFiles();updateBtns();tutorBuilt=false}
function renderFiles(){document.getElementById('fileList').innerHTML=uploadedFiles.map(f=>{const ext=f.name.split('.').pop().toLowerCase();const icon=ext==='pdf'?'📄':ext==='txt'?'📃':'🖼️';const sz=f.size>1048576?(f.size/1048576).toFixed(1)+'MB':Math.round(f.size/1024)+'KB';return`<div class="file-item"><span style="font-size:18px">${icon}</span><span class="file-name">${f.name}</span><span class="file-size">${sz}</span><button class="remove-btn" onclick="removeFile('${f.name.replace(/'/g,"\\'")}')">✕</button></div>`}).join('')}
function goPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+p).classList.add('active');document.getElementById('nav-'+p).classList.add('active');if(p==='tutor')renderTutor()}
function loading(el,msg,sub){document.getElementById(el).innerHTML=`<div class="spinner-wrap"><div class="spinner"></div><div class="spin-text">${msg}</div><div class="spin-sub">${sub}</div></div>`}
function setErr(el,msg){document.getElementById(el).innerHTML=`<div class="err">⚠️ ${msg}</div>`}
function clearEl(el){document.getElementById(el).innerHTML=''}
async function readB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(file)})}
async function readTxt(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(file)})}
async function buildMessages(prompt){
  if(inputMode==='paste')return[{role:'user',content:`${prompt}\n\nContent:\n${document.getElementById('pasteArea').value.trim()}`}];
  const parts=[];
  for(const f of uploadedFiles){const ext=f.name.split('.').pop().toLowerCase();if(ext==='txt'){const t=await readTxt(f);parts.push({type:'text',text:`File: ${f.name}\n\n${t}`})}else if(ext==='pdf'){const b=await readB64(f);parts.push({type:'document',source:{type:'base64',media_type:'application/pdf',data:b}})}else{const b=await readB64(f);parts.push({type:'image',source:{type:'base64',media_type:f.type||'image/jpeg',data:b}})}}
  parts.push({type:'text',text:prompt});
  return[{role:'user',content:parts}];
}
async function callAI(system,messages){
  const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system,messages})});
  const text=await r.text();
  let data;
  try{data=JSON.parse(text)}catch(e){throw new Error('Bad server response: '+text.slice(0,100))}
  if(!r.ok)throw new Error(data.error||`Error ${r.status}`);
  if(!data.content||!Array.isArray(data.content))throw new Error('Unexpected response format');
  const raw=data.content.map(c=>c.text||'').join('');
  return raw.replace(/^```json\s*/,'').replace(/^```\s*/,'').replace(/\s*```$/,'').trim();
}

async function doSummary(){
  clearEl('summaryErr');const btn=document.getElementById('summaryBtn');btn.disabled=true;btn.textContent='⌛ Generating Detailed Summary...';
  loading('summaryResult','Deeply analysing your content...','Extracting comprehensive overview and structured breakdowns');
  try{
    const sys=`You are an expert academic study assistant. Respond ONLY with raw JSON — no markdown, no code blocks, no explanation.
{
  "summary": "A detailed, comprehensive multi-paragraph overview of the core concepts, theories, and contexts found in the material. Do not summarize briefly; explain the material thoroughly as if writing a master textbook summary.",
  "keyPoints": [
    "Comprehensive, fully-fleshed-out key point 1 explaining a core concept in detail with its significance.",
    "Comprehensive key point 2 with context...",
    "Provide between 5 to 8 detailed, substantive key points depending on content depth."
  ],
  "keywords": ["topic1","topic2","topic3","topic4","topic5"]
}`;
    const msgs=await buildMessages('Provide a highly detailed, comprehensive academic summary of this content. Do not hold back on depth or technical nuances. Respond with raw JSON only.');
    const raw=await callAI(sys,msgs);
    const d=JSON.parse(raw);lastSummary=d;
    
    const kp=d.keyPoints.map((p,i)=>`<li class="kp"><span class="kp-n">${i+1}</span><span>${p}</span></li>`).join('');
    const tgs=(d.keywords||[]).map(k=>`<span class="tag">${k}</span>`).join('');
    
    document.getElementById('summaryResult').innerHTML=`
      <div class="copy-row"><span class="result-title">Comprehensive Study Guide</span><button class="copy-btn" onclick="copySum()">⎘ Copy Guide</button></div>
      <div class="result-card">
        <div class="block">
          <div class="block-label">Detailed Overview</div>
          <p class="summary-text" style="white-space: pre-wrap; text-align: justify; color: var(--text2); font-size: 14px; line-height: 1.8;">${d.summary}</p>
        </div>
        <div class="block">
          <div class="block-label">Core Concepts Breakdown</div>
          <ul class="kp-list">${kp}</ul>
        </div>
        ${tgs?`<div class="block"><div class="block-label">Key Subject Topics</div><div class="tags">${tgs}</div></div>`:''}
      </div>`;
  }catch(e){clearEl('summaryResult');setErr('summaryErr',e.message||'Something went wrong.')}
  finally{btn.disabled=false;btn.textContent='✦ Generate Summary & Key Points';updateBtns()}
}

function copySum(){if(!lastSummary)return;const t=`OVERVIEW\n${lastSummary.summary}\n\nKEY POINTS\n${lastSummary.keyPoints.map((p,i)=>`${i+1}. ${p}`).join('\n')}\n\nKEY TOPICS\n${(lastSummary.keywords||[]).join(', ')}`;navigator.clipboard.writeText(t).then(()=>{const b=document.querySelector('.copy-btn');if(b){b.textContent='✓ Copied!';setTimeout(()=>b.textContent='⎘ Copy all',2000)}})}
async function doQuiz(){
  clearEl('quizErr');quizData=null;quizAnswers={};quizSubmitted=false;
  const btn=document.getElementById('quizBtn');btn.disabled=true;btn.textContent='⌛ Generating...';
  loading('quizResult','Building your quiz...','Creating 5 multiple choice questions');
  try{
    const sys=`You are a quiz generator. Respond ONLY with a raw JSON array — no markdown, no code blocks, no explanation.
[{"question":"...","options":["A. ...","B. ...","C. ...","D. ..."],"answer":0,"explanation":"..."}]
answer is 0-based index. Generate exactly 5 questions.`;
    const msgs=await buildMessages('Generate a 5-question multiple choice quiz. Respond with raw JSON array only.');
    const raw=await callAI(sys,msgs);
    quizData=JSON.parse(raw);renderQuiz();
  }catch(e){clearEl('quizResult');setErr('quizErr',e.message||'Something went wrong.')}
  finally{btn.disabled=false;btn.textContent='⚡ Generate Quiz';updateBtns()}
}
function renderQuiz(){
  if(!quizData)return;
  const letters=['A','B','C','D'];
  let scoreHtml='';
  if(quizSubmitted){const score=quizData.filter((_,i)=>quizAnswers[i]===quizData[i].answer).length;const pct=Math.round((score/quizData.length)*100);const emoji=pct>=80?'🎉':pct>=60?'👍':'📚';scoreHtml=`<div class="score-bar"><div><div class="score-num">${score}/${quizData.length}</div><div class="score-label">Questions correct</div></div><div style="text-align:right"><span class="score-pct">${emoji} ${pct}%</span><button class="retake-btn" onclick="retakeQuiz()">↺ Retake</button></div></div>`}
  const qs=quizData.map((q,qi)=>{
    const opts=q.options.map((o,oi)=>{let cls='opt';if(quizSubmitted){if(oi===q.answer)cls+=' reveal-correct';else if(quizAnswers[qi]===oi)cls+=' wrong';}else if(quizAnswers[qi]===oi)cls+=' selected';return`<button class="${cls}" onclick="selectOpt(${qi},${oi})" ${quizSubmitted?'disabled':''}><span class="opt-letter">${letters[oi]}</span>${o.replace(/^[A-D]\.\s*/,'')}</button>`}).join('');
    let indicator='';if(quizSubmitted)indicator=quizAnswers[qi]===q.answer?'<span style="color:var(--success);font-size:12px;font-weight:800">✓ Correct</span>':'<span style="color:var(--danger);font-size:12px;font-weight:800">✗ Wrong</span>';
    return`<div class="q-card"><div class="q-meta"><span class="q-num">Question ${qi+1} / ${quizData.length}</span>${indicator}</div><div class="q-text">${q.question}</div><div class="options">${opts}</div>${quizSubmitted?`<div class="explanation">💡 ${q.explanation}</div>`:''}</div>`;
  }).join('');
  const allAnswered=quizData.every((_,i)=>quizAnswers[i]!==undefined);
  document.getElementById('quizResult').innerHTML=`<div style="margin-top:1.25rem">${scoreHtml}${qs}${!quizSubmitted?`<button class="action-btn" onclick="submitQuiz()" style="margin-top:0" ${allAnswered?'':'disabled'}>Submit Quiz</button>`:''}</div>`;
}
function selectOpt(qi,oi){if(quizSubmitted)return;quizAnswers[qi]=oi;renderQuiz()}
function submitQuiz(){quizSubmitted=true;renderQuiz()}
function retakeQuiz(){quizAnswers={};quizSubmitted=false;renderQuiz()}
function renderTutor(){
  if(!hasContent()){document.getElementById('tutorArea').innerHTML=`<div class="no-content-notice"><strong>No content loaded yet</strong>Add your notes in the panel above first.</div>`;tutorBuilt=false;return}
  if(tutorBuilt)return;
  tutorBuilt=true;chatHistory=[];
  document.getElementById('tutorArea').innerHTML=`
    <div class="chat-wrap">
      <div class="chat-header"><div class="tutor-avatar">✦</div><div><div class="tutor-name">Studify Tutor</div><div class="tutor-sub">Ask anything about your content</div></div></div>
      <div class="chat-messages" id="chatMsgs">
        <div class="msg bot"><div class="bubble">Hey! I've read your content and I'm ready to help. Ask me to explain anything, quiz you verbally, or go deeper on any topic. 🚀</div><span class="msg-time">now</span></div>
      </div>
      <div class="chat-input-row">
        <textarea class="chat-input" id="chatIn" placeholder="Ask a question about your content..." rows="1" onkeydown="onChatKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendChat()">➤</button>
      </div>
    </div>`;
}
function onChatKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}}
async function sendChat(){
  if(isSending)return;const inp=document.getElementById('chatIn');const msg=inp.value.trim();if(!msg)return;
  inp.value='';isSending=true;document.getElementById('sendBtn').disabled=true;
  appendMsg('user',msg);chatHistory.push({role:'user',content:msg});
  const typingId='t'+Date.now();const chatEl=document.getElementById('chatMsgs');
  chatEl.innerHTML+=`<div class="msg bot" id="${typingId}"><div class="bubble"><div class="typing-dots"><span></span><span></span><span></span></div></div></div>`;
  chatEl.scrollTop=chatEl.scrollHeight;
  try{
    let sys='You are a helpful, encouraging study tutor. Answer clearly and concisely. Keep responses student-friendly and engaging.';
    if(inputMode==='paste'){sys+=`\n\nStudent content:\n${document.getElementById('pasteArea').value.trim()}`;}
    let apiMsgs;
    if(chatHistory.length===1&&inputMode==='file'&&uploadedFiles.length>0){
      const parts=[];for(const f of uploadedFiles){const ext=f.name.split('.').pop().toLowerCase();if(ext==='txt'){const t=await readTxt(f);parts.push({type:'text',text:`File: ${f.name}\n\n${t}`})}else if(ext==='pdf'){const b=await readB64(f);parts.push({type:'document',source:{type:'base64',media_type:'application/pdf',data:b}})}else{const b=await readB64(f);parts.push({type:'image',source:{type:'base64',media_type:f.type||'image/jpeg',data:b}})}}
      parts.push({type:'text',text:msg});apiMsgs=[{role:'user',content:parts}];
    }else{apiMsgs=chatHistory;}
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:sys,messages:apiMsgs})});
    const text=await r.text();let data;
    try{data=JSON.parse(text)}catch(e){throw new Error('Bad response')}
    if(!r.ok)throw new Error(data.error||'Error');
    const reply=(data.content||[]).map(c=>c.text||'').join('');
    chatHistory.push({role:'assistant',content:reply});
    document.getElementById(typingId)?.remove();appendMsg('bot',reply);
  }catch(e){document.getElementById(typingId)?.remove();appendMsg('bot','Sorry: '+e.message);}
  finally{isSending=false;document.getElementById('sendBtn').disabled=false;inp.focus();}
}
function appendMsg(role,text){
  const chatEl=document.getElementById('chatMsgs');const now=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const safe=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  chatEl.innerHTML+=`<div class="msg ${role}"><div class="bubble">${safe}</div><span class="msg-time">${now}</span></div>`;
  chatEl.scrollTop=chatEl.scrollHeight;
}

// Initializing display safely on first load
document.addEventListener("DOMContentLoaded", function() {
  switchInput('paste');
});
</script>
